name: Keep Alive

# Keeps the Render free-tier instance from spinning down (~15 min idle timeout).
# Render free plan sleeps after inactivity, so the first visitor then waits
# 30-60s. Pinging the health endpoint every 5 minutes (GitHub's minimum) keeps
# the instance warm. Public repo => scheduled runs are free.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          URL: https://ai-trade-master.onrender.com/api/health
        run: |
          set -u
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            --max-time 75 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            "$URL" || echo "000")
          echo "HTTP $code"
          cat /tmp/health.json 2>/dev/null || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Health check returned $code"
            exit 1
          fi
