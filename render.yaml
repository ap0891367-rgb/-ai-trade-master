services:
  - type: web
    name: ai-trade-master
    runtime: node
    plan: free
    region: singapore
    # --include=dev is required: tailwind/postcss/typescript live in devDependencies
    # and are needed by `next build`.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-trade-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: SETUP_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"
      # Do not set NODE_ENV=production here: `npm ci` would skip devDependencies
      # and the Next.js build would fail. Next sets NODE_ENV itself.
      # Change these after the first deploy (seeder only reads them once).
      - key: ADMIN_EMAIL
        value: admin@autotrading.ai
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: DEMO_LOGIN_ENABLED
        value: "true"

databases:
  - name: ai-trade-db
    plan: free
    region: singapore
