services:
  - type: web
    name: ai-trade-master
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-trade-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: SETUP_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Change these after the first deploy (seeder only reads them once).
      - key: ADMIN_EMAIL
        value: admin@autotrading.ai
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: DEMO_LOGIN_ENABLED
        value: "true"

databases:
  - name: ai-trade-db
    plan: free
    region: singapore
